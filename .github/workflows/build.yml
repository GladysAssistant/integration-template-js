# -----------------------------------------------------------------------------
# Build & publication de l'image multi-architecture.
#
# Déclencheur : un tag Git de version (ex : `v1.2.0`).
# Résultat : une image poussée sur GitHub Container Registry (ghcr.io),
# pour linux/amd64 ET linux/arm64 (Raspberry Pi, etc.).
#
# C'est TOUT ce qu'il faut pour « publier » : taguez, poussez, l'indexeur
# décentralisé fait le reste (aucune revue, aucun compte à créer).
# -----------------------------------------------------------------------------
name: Build and publish image

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag from Git tag
        id: meta
        run: |
          # v1.2.0 → 1.2.0
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
